[project]
name = "rl-course-lab"
version = "0.1.0"
description = "A Python-first interactive reinforcement learning course"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "plotly>=5.18",
  "streamlit>=1.35",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
